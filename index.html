<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhotoUp — IA Visual</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    :root {
      --bg:       #0a0a0f;
      --surface:  #13131c;
      --border:   #1f1f30;
      --accent:   #00e5ff;
      --accent2:  #ff3cac;
      --text:     #e8eaf6;
      --muted:    #6b7094;
      --radius:   16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Background grid ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Glow blobs ── */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: .18;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 { width: 520px; height: 520px; background: var(--accent);  top: -120px; left: -120px; }
    .blob-2 { width: 400px; height: 400px; background: var(--accent2); bottom: -80px; right: -80px; }

    /* ── Layout ── */
    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 48px;
    }

    .badge-label {
      display: inline-block;
      font-size: .72rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 100px;
      padding: 4px 14px;
      margin-bottom: 18px;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(2.4rem, 7vw, 4rem);
      line-height: 1.05;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    .subtitle {
      color: var(--muted);
      font-size: .88rem;
      letter-spacing: .05em;
    }

    /* ── Card ── */
    .card-custom {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
    }

    /* ── Start Button ── */
    .btn-start {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--bg);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 100px;
      padding: 14px 36px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 0 28px rgba(0,229,255,.35);
    }

    .btn-start::after {
      content: '';
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      transition: opacity .2s;
    }

    .btn-start:hover  { transform: translateY(-2px); box-shadow: 0 0 44px rgba(0,229,255,.55); }
    .btn-start:active { transform: translateY(0);    box-shadow: 0 0 20px rgba(0,229,255,.25); }
    .btn-start:active::after { opacity: .08; }

    .btn-start .spinner-border {
      width: 1rem; height: 1rem;
      border-width: 2px;
      display: none;
    }

    .btn-start.loading .bi-camera-video-fill { display: none; }
    .btn-start.loading .spinner-border        { display: inline-block; }

    /* ── Webcam ── */
    #webcam-container {
      display: flex;
      justify-content: center;
      margin-top: 8px;
    }

    #webcam-container canvas {
      border-radius: 12px;
      border: 2px solid var(--border);
      box-shadow: 0 0 32px rgba(0,229,255,.12);
      max-width: 100%;
      height: auto;
    }

    /* ── Status dot ── */
    .status-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      margin-right: 6px;
      transition: background .3s;
    }
    .status-dot.active {
      background: #00e676;
      box-shadow: 0 0 8px #00e676;
      animation: pulse-dot 1.5s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: .4; }
    }

    /* ── Labels / progress ── */
    .label-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 16px;
      color: var(--text);
    }

    .prediction-item {
      margin-bottom: 18px;
    }

    .prediction-header {
      display: flex;
      justify-content: space-between;
      font-size: .8rem;
      margin-bottom: 6px;
    }

    .prediction-class { color: var(--text); }
    .prediction-pct   { color: var(--accent); font-weight: 700; }

    .progress {
      background: var(--border);
      border-radius: 100px;
      height: 10px;
      overflow: hidden;
    }

    .progress-bar {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 100px;
      transition: width .3s ease;
    }

    /* ── Divider ── */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 28px 0;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      color: var(--muted);
      font-size: .75rem;
      margin-top: 48px;
    }

    footer span { color: var(--accent2); }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="wrapper">

    <!-- Header -->
    <header>
      <div class="badge-label"><i class="bi bi-cpu-fill me-1"></i>Teachable Machine</div>
      <h1>PhotoUp</h1>
      <p class="subtitle">Reconhecimento de imagem em tempo real via webcam</p>
    </header>

    <!-- Main card -->
    <div class="card-custom">

      <!-- Camera permission button -->
      <div class="text-center mb-4">
        <button class="btn-start" id="btnStart" onclick="init()">
          <i class="bi bi-camera-video-fill"></i>
          <span class="spinner-border" role="status"></span>
          Ativar Câmera
        </button>
        <div class="mt-3" style="font-size:.78rem; color:var(--muted);">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Câmera inativa</span>
        </div>
      </div>

      <!-- Webcam -->
      <div id="webcam-container"></div>

      <!-- Divider + predictions -->
      <div id="results-section" style="display:none;">
        <hr class="divider" />
        <p class="label-title"><i class="bi bi-bar-chart-fill me-2" style="color:var(--accent);"></i>Classificações</p>
        <div id="label-container"></div>
      </div>

    </div>

    <footer>
      Desenvolvido por <span>Paulo &amp; Renato</span> · Powered by TensorFlow.js &amp; Teachable Machine
    </footer>

  </div>

  <!-- TensorFlow + Teachable Machine -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const URL = "https://teachablemachine.withgoogle.com/models/vEEko2JW62/";
    let model, webcam, labelContainer, maxPredictions;

    // Gera uma cor hsl única por índice
    function barColor(i, total) {
      const hue = Math.round((i / total) * 280);
      return `hsl(${hue}, 90%, 60%)`;
    }

    async function init() {
      const btn  = document.getElementById('btnStart');
      const dot  = document.getElementById('statusDot');
      const stat = document.getElementById('statusText');

      btn.classList.add('loading');
      btn.disabled = true;
      stat.textContent = 'Carregando modelo…';

      try {
        model = await tmImage.load(URL + "model.json", URL + "metadata.json");
        maxPredictions = model.getTotalClasses();

        webcam = new tmImage.Webcam(280, 280, true);
        await webcam.setup();
        await webcam.play();

        document.getElementById("webcam-container").appendChild(webcam.canvas);

        // Build prediction rows
        labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = '';

        for (let i = 0; i < maxPredictions; i++) {
          const item = document.createElement('div');
          item.className = 'prediction-item';
          item.innerHTML = `
            <div class="prediction-header">
              <span class="prediction-class" id="class-${i}">—</span>
              <span class="prediction-pct" id="pct-${i}">0%</span>
            </div>
            <div class="progress">
              <div class="progress-bar" id="bar-${i}" style="width:0%"></div>
            </div>`;
          labelContainer.appendChild(item);
        }

        document.getElementById('results-section').style.display = 'block';

        // Status active
        dot.classList.add('active');
        stat.textContent = 'Câmera ativa';
        btn.classList.remove('loading');
        btn.innerHTML = '<i class="bi bi-arrow-clockwise"></i> Reiniciar';
        btn.disabled = false;

        window.requestAnimationFrame(loop);

      } catch (err) {
        console.error(err);
        stat.textContent = 'Erro ao acessar a câmera.';
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    }

    async function loop() {
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      for (let i = 0; i < maxPredictions; i++) {
        const name  = prediction[i].className;
        const prob  = prediction[i].probability;
        const pct   = Math.round(prob * 100);

        document.getElementById(`class-${i}`).textContent = name;
        document.getElementById(`pct-${i}`).textContent   = pct + '%';
        document.getElementById(`bar-${i}`).style.width   = pct + '%';
      }
    }
  </script>

</body>
</html>
